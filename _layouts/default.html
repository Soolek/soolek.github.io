{%- assign page_lang = page.lang | default: site.lang -%}
<!DOCTYPE html>
<html lang="{{ page_lang }}">

  {% include head.html %}

  <body>

    {% include header.html %}

    <div class="page-content">

      <div class="wrapper">

        <div class="col-main">
          {{ content }}
        </div>
        <div class="col-second">
          {% include sidebar.html %}
        </div>

      </div>

    </div>

    <footer class="footer">
      <div class="wrapper">
        <span>&copy; {{ site.time | date: "%Y" }} {{ site.author }}</span>
        <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
      </div>
    </footer>
    {%- if page.gallery %}
    <script src="{{ "/assets/vendor/glightbox/glightbox.min.js" | relative_url }}" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.GLightbox) {
          GLightbox({ selector: ".glightbox", touchNavigation: true, loop: true });
        }
      });
    </script>
    {%- endif %}

  </body>

</html>
